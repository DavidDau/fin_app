services:
  - type: web
    name: finapp-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render free web services do not support pre-deploy commands.
    # Run the migration immediately before the single API process starts instead.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        fromDatabase:
          name: finapp-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true

  - type: web
    name: finapp-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: finapp-db
    plan: free
    region: oregon
    databaseName: finapp
    user: finapp
